services:
  - type: web
    name: fastapi-config-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_PORT
        value: '8852'
      - key: APP_WORKERS
        value: '13'
      - key: APP_LOG_LEVEL
        value: debug
      - key: APP_API_KEY
        value: key-2wtsv68q7q
